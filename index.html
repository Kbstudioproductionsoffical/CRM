<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>KB Studio Productions — CRM v76.0</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js" async></script>
<style>
/* ─── RESET & BASE ─────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f1f5f9;color:#1e293b;font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
a{color:inherit;text-decoration:none}

/* ─── LAYOUT ───────────────────────────────────────── */
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:220px;background:#0f172a;color:#fff;display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#sidebar.collapsed{width:60px}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{height:52px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
#content{flex:1;overflow-y:auto;padding:20px}

/* ─── SIDEBAR ──────────────────────────────────────── */
.sb-logo{padding:18px 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;flex-shrink:0}
.sb-logo-text{font-size:13px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden}
.sb-logo-sub{font-size:10px;color:rgba(255,255,255,.4);font-weight:400}
.sb-nav{flex:1;padding:12px 8px;overflow-y:auto}
.sb-nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;transition:background .15s;color:rgba(255,255,255,.65);font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;margin-bottom:2px}
.sb-nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.sb-nav-item.active{background:rgba(59,130,246,.2);color:#60a5fa;font-weight:700}
.sb-nav-icon{font-size:17px;flex-shrink:0;width:22px;text-align:center}
.sb-footer{padding:12px 8px;border-top:1px solid rgba(255,255,255,.08)}
.sb-user{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;color:rgba(255,255,255,.7);font-size:12px;white-space:nowrap;overflow:hidden}
.sb-user:hover{background:rgba(255,255,255,.07)}
.sb-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}

/* ─── TOPBAR ───────────────────────────────────────── */
#topbar-title{font-size:16px;font-weight:700;color:#0f172a;flex:1}
.topbar-btn{padding:6px 14px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;font-size:12px;font-weight:600;color:#374151}
.topbar-btn:hover{background:#f8fafc}
#urgent-badge{background:#ef4444;color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;display:none}

/* ─── CARDS ────────────────────────────────────────── */
.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.card+.card{margin-top:16px}
.card-title{font-size:13px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}

/* ─── STAT TILES ────────────────────────────────────── */
.stat-tile{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.stat-label{font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px}
.stat-value{font-size:22px;font-weight:800;color:#0f172a;margin-top:4px}
.stat-sub{font-size:11px;color:#64748b;margin-top:2px}
.stat-tile.accent-blue{border-left:3px solid #3b82f6}
.stat-tile.accent-green{border-left:3px solid #22c55e}
.stat-tile.accent-red{border-left:3px solid #ef4444}
.stat-tile.accent-amber{border-left:3px solid #f59e0b}

/* ─── BADGES ────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.badge-green{background:#dcfce7;color:#15803d}
.badge-blue{background:#dbeafe;color:#1d4ed8}
.badge-amber{background:#fef3c7;color:#92400e}
.badge-red{background:#fee2e2;color:#b91c1c}
.badge-purple{background:#f3e8ff;color:#7c3aed}
.badge-gray{background:#f1f5f9;color:#64748b}
.badge-urgent{background:#ef4444;color:#fff;animation:pulse-badge 1.5s infinite}
@keyframes pulse-badge{0%,100%{opacity:1}50%{opacity:.7}}

/* ─── STAGE BADGE COLORS ────────────────────────────── */
.stage-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.stage-lead{background:#f3e8ff;color:#7c3aed}
.stage-preprod{background:#dbeafe;color:#1d4ed8}
.stage-production{background:#fef3c7;color:#92400e}
.stage-postprod{background:#fff7ed;color:#c2410c}
.stage-delivery{background:#dcfce7;color:#15803d}
.stage-complete{background:#f1f5f9;color:#94a3b8}
.stage-lost{background:#fee2e2;color:#b91c1c}

/* ─── URGENCY CARDS ─────────────────────────────────── */
.urgency-card{border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:8px;cursor:pointer;transition:transform .1s,box-shadow .1s}
.urgency-card:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.08)}
.urgency-overdue{background:#fef2f2;border:1.5px solid #fca5a5}
.urgency-today{background:#fff7ed;border:1.5px solid #fed7aa}
.urgency-soon{background:#fefce8;border:1.5px solid #fde68a}
.urgency-upcoming{background:#eff6ff;border:1px solid #bfdbfe}
.uc-icon{font-size:22px;flex-shrink:0}
.uc-body{flex:1;min-width:0}
.uc-name{font-size:14px;font-weight:800;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uc-detail{font-size:11px;color:#64748b;margin-top:1px}
.uc-amount{font-size:16px;font-weight:800;flex-shrink:0;text-align:right}
.uc-days{font-size:10px;font-weight:600;text-align:right;margin-top:2px}

/* ─── PAYMENT TIMELINE ──────────────────────────────── */
.pay-timeline-stage{border:1.5px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:10px;background:#fff;transition:border-color .2s}
.pay-timeline-stage.paid{border-color:#bbf7d0;background:#f0fdf4}
.pay-timeline-stage.partial{border-color:#fed7aa;background:#fff7ed}
.pay-timeline-stage.overdue{border-color:#fca5a5;background:#fef2f2}
.pay-timeline-stage.today-due{border-color:#f97316;background:#fff7ed}
.pay-timeline-stage.pending{border-color:#e2e8f0;background:#fff}
.pts-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.pts-label{font-size:13px;font-weight:700;color:#1e293b}
.pts-planned{font-size:11px;color:#94a3b8;margin-top:1px}
.pts-status{text-align:right;flex-shrink:0}
.pts-remaining{font-size:18px;font-weight:800;color:#0f172a}
.pts-credit-note{font-size:11px;color:#64748b;background:#f8fafc;border-radius:8px;padding:6px 10px;margin-top:8px;line-height:1.4}
.pts-credit-note.has-credit{background:#fefce8;color:#92400e;border:1px solid #fde68a}
.pts-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* ─── BUTTONS ────────────────────────────────────────── */
.btn{padding:8px 16px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:#0f172a;color:#fff}
.btn-primary:hover:not(:disabled){background:#1e293b}
.btn-blue{background:#3b82f6;color:#fff}
.btn-blue:hover:not(:disabled){background:#2563eb}
.btn-green{background:#22c55e;color:#fff}
.btn-green:hover:not(:disabled){background:#16a34a}
.btn-red{background:#ef4444;color:#fff}
.btn-red:hover:not(:disabled){background:#dc2626}
.btn-amber{background:#f59e0b;color:#fff}
.btn-amber:hover:not(:disabled){background:#d97706}
.btn-ghost{background:#f1f5f9;color:#374151;border:1px solid #e2e8f0}
.btn-ghost:hover:not(:disabled){background:#e2e8f0}
.btn-whatsapp{background:#25d366;color:#fff}
.btn-whatsapp:hover:not(:disabled){background:#128c7e}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:6px}
.btn-xs{padding:3px 8px;font-size:10px;border-radius:6px}

/* ─── FORMS ──────────────────────────────────────────── */
.form-group{margin-bottom:14px}
.form-label{font-size:12px;font-weight:600;color:#374151;margin-bottom:4px;display:block}
.form-input{width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;color:#1e293b;background:#fff;transition:border-color .15s;outline:none}
.form-input:focus{border-color:#3b82f6}
.form-input::placeholder{color:#94a3b8}
select.form-input{cursor:pointer}
textarea.form-input{resize:vertical;min-height:80px}

/* ─── TABLE ──────────────────────────────────────────── */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:8px 12px;font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;border-bottom:1.5px solid #e2e8f0;white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .1s}
.tbl tbody tr:hover{background:#f8fafc}

/* ─── TABS ───────────────────────────────────────────── */
.tabs{display:flex;gap:4px;border-bottom:2px solid #e2e8f0;margin-bottom:20px;overflow-x:auto}
.tab-btn{padding:9px 16px;border:none;background:none;font-size:13px;font-weight:600;color:#64748b;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab-btn:hover{color:#1e293b}
.tab-btn.active{color:#3b82f6;border-bottom-color:#3b82f6}
.tab-pane{display:none}
.tab-pane.active{display:block}

/* ─── PROJECT CARD ───────────────────────────────────── */
.proj-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;cursor:pointer;transition:all .15s;display:flex;gap:14px;align-items:flex-start}
.proj-card:hover{border-color:#93c5fd;box-shadow:0 4px 20px rgba(59,130,246,.1);transform:translateY(-1px)}
.proj-card-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.proj-card-body{flex:1;min-width:0}
.proj-card-name{font-size:15px;font-weight:800;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-card-sub{font-size:11px;color:#64748b;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.proj-card-fin{text-align:right;flex-shrink:0}
.proj-card-bal{font-size:16px;font-weight:800}
.proj-card-bal.paid{color:#22c55e}
.proj-card-bal.due{color:#ef4444}
.proj-card-bal.partial{color:#f59e0b}

/* ─── MODALS ─────────────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:none;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal-box{background:#fff;border-radius:18px;width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto;position:relative;overflow:hidden}
.modal-box.modal-lg{max-width:920px}
.modal-box.modal-sm{max-width:480px}
.modal-header{padding:20px 24px 0;display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid #f1f5f9;padding-bottom:16px}
.modal-title{font-size:18px;font-weight:800;color:#0f172a;flex:1}
.modal-subtitle{font-size:12px;color:#64748b;margin-top:2px}
.modal-close{background:none;border:none;font-size:20px;color:#94a3b8;cursor:pointer;padding:4px;line-height:1;flex-shrink:0}
.modal-close:hover{color:#1e293b}
.modal-body{padding:20px 24px;max-height:calc(100vh - 180px);overflow-y:auto}
.modal-footer{padding:16px 24px;border-top:1px solid #f1f5f9;display:flex;justify-content:flex-end;gap:8px}

/* ─── TOASTS ─────────────────────────────────────────── */
#toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{background:#1e293b;color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:toastIn .25s ease;max-width:340px;display:flex;align-items:center;gap:8px}
.toast.error{background:#dc2626}
.toast.success{background:#16a34a}
.toast.warn{background:#d97706}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ─── EMPTY STATES ───────────────────────────────────── */
.empty-state{text-align:center;padding:48px 24px;color:#94a3b8}
.empty-state-icon{font-size:48px;display:block;margin-bottom:12px}
.empty-state-title{font-size:16px;font-weight:700;color:#64748b;margin-bottom:4px}
.empty-state-sub{font-size:13px}

/* ─── LOGIN SCREEN ───────────────────────────────────── */
#login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 100%);display:flex;align-items:center;justify-content:center;z-index:9000}
.login-box{background:#fff;border-radius:20px;padding:40px;width:100%;max-width:380px;box-shadow:0 25px 80px rgba(0,0,0,.4)}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo-icon{width:64px;height:64px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:16px;display:inline-flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#fff;margin-bottom:12px}
.login-logo-title{font-size:22px;font-weight:800;color:#0f172a}
.login-logo-sub{font-size:12px;color:#64748b;margin-top:2px}
.login-error{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:10px 14px;border-radius:8px;font-size:12px;margin-bottom:14px;display:none}

/* ─── SEARCH ─────────────────────────────────────────── */
.search-bar{position:relative}
.search-bar input{width:100%;padding:9px 12px 9px 36px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:13px;outline:none;transition:border-color .15s}
.search-bar input:focus{border-color:#3b82f6}
.search-bar-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:15px}

/* ─── RESPONSIVE ─────────────────────────────────────── */
@media(max-width:768px){
  #sidebar{display:none}
  #content{padding:12px}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .modal-overlay{padding:0;align-items:flex-end}
  .modal-box{border-radius:18px 18px 0 0;max-width:100%;margin:0}
}

/* ─── PAYMENT LEDGER ─────────────────────────────────── */
.ledger-entry{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:#f8fafc;border:1px solid #e2e8f0;margin-bottom:6px}
.le-icon{width:32px;height:32px;border-radius:8px;background:#dbeafe;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.le-body{flex:1;min-width:0}
.le-amount{font-size:15px;font-weight:800;color:#16a34a;flex-shrink:0}
.le-date{font-size:11px;color:#94a3b8}
.le-stage{font-size:11px;font-weight:600;color:#64748b}
.le-actions{display:flex;gap:4px;flex-shrink:0}

/* ─── SCROLLBAR ──────────────────────────────────────── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}

/* ─── MISC ───────────────────────────────────────────── */
.divider{height:1px;background:#f1f5f9;margin:16px 0}
.text-muted{color:#94a3b8;font-size:12px}
.text-green{color:#16a34a}
.text-red{color:#dc2626}
.text-amber{color:#d97706}
.text-blue{color:#2563eb}
.fw-800{font-weight:800}
.mt-4{margin-top:4px}
.mt-8{margin-top:8px}
.mt-12{margin-top:12px}
.mt-16{margin-top:16px}
.d-flex{display:flex;align-items:center;gap:8px}
.justify-between{justify-content:space-between}
.gap-4{gap:4px}
.gap-8{gap:8px}
.flex-1{flex:1}
.text-right{text-align:right}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-icon">KB</div>
      <div class="login-logo-title">KB Studio Productions</div>
      <div class="login-logo-sub">CRM v76.0 — Studio OS</div>
    </div>
    <div id="login-error" class="login-error"></div>
    <div class="form-group">
      <label class="form-label">Username</label>
      <input id="li-user" class="form-input" type="text" placeholder="Enter your username" autocomplete="username">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input id="li-pass" class="form-input" type="password" placeholder="Enter your password" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" style="width:100%;padding:12px;font-size:14px" onclick="doLogin()">Sign In →</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none">

  <!-- SIDEBAR -->
  <nav id="sidebar">
    <div class="sb-logo">
      <div class="sb-logo-icon">KB</div>
      <div class="sb-logo-text">
        <div>KB Studio</div>
        <div class="sb-logo-sub">Productions CRM</div>
      </div>
    </div>
    <div class="sb-nav">
      <div class="sb-nav-item active" onclick="navTo('dashboard')">
        <span class="sb-nav-icon">🏠</span><span>Dashboard</span>
      </div>
      <div class="sb-nav-item" onclick="navTo('projects')">
        <span class="sb-nav-icon">📁</span><span>Projects</span>
      </div>
      <div class="sb-nav-item" onclick="navTo('collections')">
        <span class="sb-nav-icon">💰</span><span>Collections</span><span id="sb-urgent-dot" style="display:none;width:7px;height:7px;background:#ef4444;border-radius:50%;margin-left:auto"></span>
      </div>
      <div class="sb-nav-item" onclick="navTo('calendar')">
        <span class="sb-nav-icon">📅</span><span>Calendar</span>
      </div>
      <div class="sb-nav-item" onclick="navTo('team')">
        <span class="sb-nav-icon">👥</span><span>Team</span>
      </div>
      <div class="sb-nav-item" onclick="navTo('settings')">
        <span class="sb-nav-icon">⚙️</span><span>Settings</span>
      </div>
    </div>
    <div class="sb-footer">
      <div class="sb-user" onclick="doLogout()">
        <div class="sb-avatar" id="sb-avatar">?</div>
        <div style="overflow:hidden">
          <div style="font-size:12px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="sb-name">Loading…</div>
          <div style="font-size:10px;color:rgba(255,255,255,.4)">Sign out →</div>
        </div>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <div id="main">
    <!-- TOPBAR -->
    <div id="topbar">
      <div id="topbar-title">Dashboard</div>
      <div class="d-flex gap-8" style="margin-left:auto">
        <span id="urgent-badge" class="badge badge-red">0 Overdue</span>
        <span id="topbar-user-role" class="badge badge-gray"></span>
      </div>
    </div>

    <!-- CONTENT AREA -->
    <div id="content">
      <!-- Pages rendered by JS -->
    </div>
  </div>
</div>

<!-- TOAST CONTAINER -->
<div id="toast-container"></div>

<!-- PROJECT MODAL -->
<div id="proj-modal" class="modal-overlay">
  <div class="modal-box modal-lg">
    <div class="modal-header">

// ── UTILS ──────────────────────────────────────────────────
function $(id){ return document.getElementById(id); }

// ── FINANCIAL CALCULATIONS ─────────────────────────────────
function netVal(p){
  return Math.max(0, (parseInt(p.value)||0) - (parseInt(p.discount)||0));
}
function paidTotal(p){
  return (p.payLedger||[]).reduce(function(a,e){ return a + (parseInt(e.amount)||0); }, 0);
}
function balDue(p){
  return Math.max(0, netVal(p) - paidTotal(p));
}

// Stage aliases for payment matching
var STAGE_ALIASES = {
  advance:  ['kb_advance','advance','booking','token','cp0','p0','advance_payment','a','adv','initial'],
  event:    ['kb_event','event','event_payment','cp1','p1','wedding_payment','second','2nd','main'],
  prewed:   ['kb_prewed','prewed','pre_wedding','prewedding','pre-wedding'],
  rawdata:  ['kb_rawdata','rawdata','raw_data','hdd','raw','data'],
  teaser:   ['kb_teaser','teaser','highlight','film','video'],
  final:    ['kb_final','final','final_delivery','album','closing','last','delivery']
};

function getCategory(stageKey){
  var k = (stageKey||'').toLowerCase().replace(/[^a-z0-9]/g,'_');
  for(var cat in STAGE_ALIASES){
    if(STAGE_ALIASES[cat].indexOf(k) >= 0) return cat;
  }
  return null;
}

// ── PAYMENT RECONCILIATION ENGINE ─────────────────────────
function reconcilePayments(p){
  if(!p) return [];
  var net = netVal(p);
  if(net <= 0) return [];

  // Build schedule from plan
  var terms = getPayTerms(p);
  var schedule = terms.map(function(t){
    return {
      key: t.key,
      label: (p.payTermLabels && p.payTermLabels[t.key+'_label']) || t.label,
      desc: (p.payTermLabels && p.payTermLabels[t.key+'_desc']) || t.desc || '',
      pct: t.pct,
      baseExp: Math.round(net * t.pct / 100),
      directPaid: 0,
      allocatedPaid: 0,
      category: getCategory(t.key) || t.category || 'general',
      dueDate: p['pay_'+t.key+'_due'] || ''
    };
  });

  // Match ledger payments to stages
  var unallocatedPool = 0;
  (p.payLedger||[]).forEach(function(e){
    var amt = parseInt(e.amount)||0;
    if(amt <= 0) return;
    var stageRaw = (e.stage||'general').toLowerCase().replace(/[^a-z0-9]/g,'_');
    var matched = false;

    // Direct key match
    for(var i=0;i<schedule.length;i++){
      if(schedule[i].key === e.stage || schedule[i].key.replace(/[^a-z0-9]/g,'_') === stageRaw){
        schedule[i].directPaid += amt;
        matched = true; break;
      }
    }
    // Category match
    if(!matched && stageRaw !== 'general'){
      var eCat = getCategory(e.stage);
      if(eCat){
        for(var j=0;j<schedule.length;j++){
          if(schedule[j].category === eCat){
            schedule[j].directPaid += amt;
            matched = true; break;
          }
        }
      }
    }
    // Advance fallback
    if(!matched && STAGE_ALIASES.advance.indexOf(stageRaw) >= 0 && schedule.length > 0){
      schedule[0].directPaid += amt;
      matched = true;
    }
    if(!matched) unallocatedPool += amt;
  });

  // Flow surplus credit forward — NEVER inflate downstream
  var surplusCredit = 0;
  schedule.forEach(function(s){
    var creditApplied = Math.min(surplusCredit, s.baseExp);
    s.creditIn = creditApplied;
    surplusCredit -= creditApplied;
    s.exp = s.baseExp - creditApplied;

    if(s.directPaid > s.exp){
      surplusCredit += (s.directPaid - s.exp);
      s.paid = s.exp;
      s.shortfall = 0;
    } else {
      s.paid = s.directPaid;
      s.shortfall = s.exp - s.directPaid;
    }

    // Absorb from unallocated pool
    if(s.shortfall > 0 && unallocatedPool > 0){
      var fromPool = Math.min(s.shortfall, unallocatedPool);
      unallocatedPool -= fromPool;
      s.allocatedPaid += fromPool;
      s.paid += fromPool;
      s.shortfall -= fromPool;
    }

    s.status = s.shortfall <= 0 ? 'paid' : (s.paid > 0 ? 'partial' : 'pending');
    s.isSettled = s.shortfall <= 0;
  });

  // Second pass for remaining pool
  if(unallocatedPool > 0){
    schedule.forEach(function(s){
      if(s.shortfall > 0 && unallocatedPool > 0){
        var fp = Math.min(s.shortfall, unallocatedPool);
        unallocatedPool -= fp;
        s.paid += fp;
        s.shortfall -= fp;
        s.status = s.shortfall <= 0 ? 'paid' : (s.paid > 0 ? 'partial' : 'pending');
        s.isSettled = s.shortfall <= 0;
      }
    });
  }

  return schedule;
}

// ── PAY TERMS BUILDER ──────────────────────────────────────
function getPayTerms(p){
  if(p.kbSchedule && p.kbSchedule.stages && p.kbSchedule.stages.length){
    return p.kbSchedule.stages.map(function(s){
      return { key:s.key, label:s.label||s.key, desc:s.desc||'', pct:s.pct||0, category:getCategory(s.key)||'general' };
    });
  }
  // Legacy preset fallback
  var preset = p.paymentPreset || '50-50';
  var net = netVal(p);
  var presets = {
    '50-50': [{key:'kb_advance',label:'Advance',desc:'To block the date',pct:50},{key:'kb_event',label:'Final Instalment',desc:'Before the event',pct:50}],
    '30-60-10': [{key:'kb_advance',label:'Advance',desc:'To block the date',pct:30},{key:'kb_event',label:'Event Payment',desc:'Due on event day',pct:60},{key:'kb_final',label:'Final Delivery',desc:'After album delivery',pct:10}],
    '20-60-10-10': [{key:'kb_advance',label:'Advance',desc:'To block the date',pct:20},{key:'kb_event',label:'Event Payment',desc:'Due on event day',pct:60},{key:'kb_rawdata',label:'Raw Data Payment',desc:'After footage handover',pct:10},{key:'kb_final',label:'Final Delivery',desc:'After album delivery',pct:10}],
    '30-40-20-10': [{key:'kb_advance',label:'Advance',desc:'To block the date',pct:30},{key:'kb_event',label:'Event Payment',desc:'Due on event day',pct:40},{key:'kb_rawdata',label:'Raw Data Payment',desc:'After footage handover',pct:20},{key:'kb_final',label:'Final Delivery',desc:'After album delivery',pct:10}]
  };
  var terms = presets[preset] || presets['50-50'];
  // Handle custom splits (cp0, cp1…)
  if(p.customSplits && Array.isArray(p.customSplits) && p.customSplits.length){
    terms = p.customSplits.map(function(cs,i){
      return { key:'cp'+i, label:cs.label||('Stage '+(i+1)), desc:cs.desc||'', pct:cs.pct||0, category:getCategory('cp'+i)||'general' };
    });
  }
  return terms;
}

// ── URGENCY CLASSIFIER ────────────────────────────────────
function classifyUrgency(daysLeft){
  if(daysLeft === null) return 'none';
  if(daysLeft < 0) return 'overdue';
  if(daysLeft === 0) return 'today';
  if(daysLeft <= 7) return 'soon';
  if(daysLeft <= 30) return 'upcoming';
  return 'later';
}

function urgencyBadgeHtml(daysLeft){
  var u = classifyUrgency(daysLeft);
  if(u === 'overdue') return '<span class="badge badge-urgent">'+Math.abs(daysLeft)+'d overdue</span>';
  if(u === 'today')   return '<span class="badge badge-red">Due TODAY</span>';
  if(u === 'soon')    return '<span class="badge badge-amber">In '+daysLeft+'d</span>';
  if(u === 'upcoming')return '<span class="badge badge-blue">In '+daysLeft+'d</span>';
  return '<span class="badge badge-gray">In '+daysLeft+'d</span>';
}

// ── STAGE BADGE ───────────────────────────────────────────
function stageBadgeHtml(stage){

// ── DATA LOADING ──────────────────────────────────────────
function loadAllData(){
  db.ref('crm_projects').once('value', function(snap){
    var d = snap.val()||{};
    Object.keys(d).forEach(function(k){ if(!d[k].id) d[k].id=k; });
    projects = d;
    updateUrgencyBadge();
    renderPage(currentPage);

    // Live listeners for changes
    db.ref('crm_projects').on('child_changed', function(s){
      var v=s.val(); if(v&&!v.id) v.id=s.key;
      projects[s.key]=v;
      updateUrgencyBadge();
      if(!document.querySelector('.modal-overlay.open')) renderPage(currentPage);
    });
    db.ref('crm_projects').on('child_added', function(s){
      if(projects[s.key]) return;
      var v=s.val(); if(v&&!v.id) v.id=s.key;
      projects[s.key]=v;
      updateUrgencyBadge();
      if(!document.querySelector('.modal-overlay.open')) renderPage(currentPage);
    });
  });
  db.ref('crm_users').on('value', function(snap){ users = snap.val()||{}; });
  db.ref('crm_settings').once('value', function(snap){ settings = snap.val()||{}; });
  db.ref('crm_quotations').once('value', function(snap){ quotations = snap.val()||{}; });

// ── URGENCY BADGE ─────────────────────────────────────────
function updateUrgencyBadge(){
  var count = getUrgentItems().filter(function(x){ return x.urgency==='overdue'||x.urgency==='today'; }).length;
  var badge = $('urgent-badge');
  var dot = $('sb-urgent-dot');
  if(count > 0){
    badge.textContent = count+' Overdue';
    badge.style.display = 'inline-flex';
    if(dot) dot.style.display = 'block';
  } else {
    badge.style.display = 'none';
    if(dot) dot.style.display = 'none';
  }
}

function getUrgentItems(){
  var results = [];
  Object.values(projects).forEach(function(p){
    if(p.stage==='complete'||p.stage==='lost') return;
    var sch = reconcilePayments(p);
    sch.forEach(function(s){
      if(s.shortfall <= 0) return;
      var due = s.dueDate || p['pay_'+s.key+'_due'] || '';
      if(!due) return;
      var days = daysUntil(due);
      var urgency = classifyUrgency(days);
      if(urgency==='none'||urgency==='later') return;
      results.push({ p:p, stage:s, due:due, days:days, urgency:urgency });
    });
    // Also check main event date
    if(p.date){
      var sch2 = sch.find(function(s){ return !s.isSettled && (s.category==='event'||s.category==='advance'); });
      if(sch2) {
        var days2 = daysUntil(p.date);
        var u2 = classifyUrgency(days2);
        if((u2==='today'||u2==='overdue') && !results.find(function(r){ return r.p.id===p.id&&r.stage.key===sch2.key; })){
          results.push({ p:p, stage:sch2, due:p.date, days:days2, urgency:u2 });
        }
      }
    }
  });
  results.sort(function(a,b){ return a.days - b.days; });
  return results;
}

  renderPage(page);

  if(page==='dashboard') container.innerHTML = renderDashboard();
  else if(page==='projects') container.innerHTML = renderProjects();
  else if(page==='collections') container.innerHTML = renderCollections();
  else if(page==='calendar') container.innerHTML = renderCalendar();
  else if(page==='team') container.innerHTML = renderTeam();
  else if(page==='settings') container.innerHTML = renderSettings();
}

// ── PAGE: DASHBOARD ────────────────────────────────────────
function renderDashboard(){
  var list = Object.values(projects);
  var active = list.filter(function(p){ return p.stage!=='complete'&&p.stage!=='lost'; });
  var totalRev = active.reduce(function(a,p){ return a+netVal(p); },0);
  var totalPaid = active.reduce(function(a,p){ return a+paidTotal(p); },0);
  var totalBal = active.reduce(function(a,p){ return a+balDue(p); },0);
  var urgentItems = getUrgentItems();
  var overdueItems = urgentItems.filter(function(x){ return x.urgency==='overdue'||x.urgency==='today'; });

  var thisMonth = new Date().toISOString().substring(0,7);
  var monthPaid = list.reduce(function(a,p){
    return a + (p.payLedger||[]).filter(function(e){ return (e.date||'').startsWith(thisMonth); }).reduce(function(b,e){ return b+(parseInt(e.amount)||0); },0);
  },0);

  var h = '';
  // Stats
  h += '<div class="grid-4" style="margin-bottom:20px">';
  h += '<div class="stat-tile accent-blue"><div class="stat-label">Active Projects</div><div class="stat-value">'+active.length+'</div><div class="stat-sub">'+list.length+' total in database</div></div>';
  h += '<div class="stat-tile accent-green"><div class="stat-label">This Month Collected</div><div class="stat-value">'+fmt(monthPaid)+'</div><div class="stat-sub">Cash flow in '+new Date().toLocaleString('default',{month:'long'})+'</div></div>';
  h += '<div class="stat-tile accent-red"><div class="stat-label">Total Balance Due</div><div class="stat-value">'+fmt(totalBal)+'</div><div class="stat-sub">Across all active projects</div></div>';
  h += '<div class="stat-tile accent-amber"><div class="stat-label">Overdue Payments</div><div class="stat-value">'+overdueItems.length+'</div><div class="stat-sub">Need immediate action</div></div>';
  h += '</div>';

  // Urgent section
  if(overdueItems.length > 0){
    h += '<div class="card" style="border-color:#fca5a5;margin-bottom:16px">';
    h += '<div class="card-title">🚨 Urgent Collections ('+overdueItems.length+')</div>';
    overdueItems.slice(0,5).forEach(function(item){
      h += renderUrgencyCard(item);
    });
    if(overdueItems.length>5) h += '<div class="text-muted" style="text-align:center;padding:8px">+' + (overdueItems.length-5) + ' more — <a href="#" onclick="navTo(\'collections\');return false" style="color:#3b82f6">View all in Collections</a></div>';
    h += '</div>';
  }

  // Upcoming shoots this week
  var todayStr = new Date().toISOString().slice(0,10);
  var inWeek = new Date(Date.now()+7*86400000).toISOString().slice(0,10);
  var upcoming = active.filter(function(p){
    var d = p.date || (p.eventDays&&p.eventDays[0]&&p.eventDays[0].date);
    return d && d >= todayStr && d <= inWeek;
  }).sort(function(a,b){
    return (a.date||'').localeCompare(b.date||'');
  });

  h += '<div class="grid-2">';

  // Upcoming shoots card
  h += '<div class="card"><div class="card-title">📅 Upcoming Shoots (7 days)</div>';
  if(upcoming.length===0) h += '<div class="empty-state" style="padding:24px"><span class="empty-state-icon">🗓️</span><div class="empty-state-title">No shoots this week</div></div>';
  upcoming.forEach(function(p){
    var d = p.date || (p.eventDays&&p.eventDays[0]&&p.eventDays[0].date);
    var days = daysUntil(d);
    h += '<div class="urgency-card urgency-upcoming" onclick="openProject(\''+p.id+'\',\'pt-overview\')">';
    h += '<div class="uc-icon">📸</div>';
    h += '<div class="uc-body"><div class="uc-name">'+esc(coupleName(p.bride,p.groom))+'</div>';
    h += '<div class="uc-detail">'+esc(p.city||p.venue||'')+'</div></div>';

var _projFilter = { stage:'all', search:'' };

  ['all','lead','preprod','production','postprod','delivery','complete'].forEach(function(s){
    var labels = {all:'All',lead:'Lead',preprod:'Pre-Prod',production:'Production',postprod:'Post-Prod',delivery:'Delivery',complete:'Complete'};
    h += '<button class="btn btn-sm '+((_projFilter.stage===s)?'btn-primary':'btn-ghost')+'" onclick="setProjFilter(\''+s+'\')">'+labels[s]+'</button>';
  });
  h += '</div>';
  h += '<button class="btn btn-blue btn-sm" onclick="openNewProject()">+ New Project</button>';
  h += '</div>';

  var list = Object.values(projects);
  if(_projFilter.stage !== 'all') list = list.filter(function(p){ return p.stage===_projFilter.stage; });
  if(_projFilter.search){
    var q = _projFilter.search.toLowerCase();
    list = list.filter(function(p){
      return (coupleName(p.bride,p.groom)).toLowerCase().includes(q) ||
             (p.refcode||'').toLowerCase().includes(q) ||
             (p.city||'').toLowerCase().includes(q) ||
             (p.phone||'').includes(q);
    });
  }
  list.sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });

  h += '<div style="margin-bottom:10px;font-size:12px;color:#94a3b8">'+list.length+' projects</div>';

    var dDays = d ? daysUntil(d) : null;
    var stageIcons = {lead:'✏️',preprod:'📝',production:'🎬',postprod:'🖥️',delivery:'📦',complete:'✅',lost:'❌'};
    var pkg = p.package || '';
    h += '<div class="proj-card" style="margin-bottom:10px" onclick="openProject(\''+p.id+'\',\'pt-overview\')">';
    h += '<div class="proj-card-icon" style="background:'+(p.stage==='complete'?'#f0fdf4':p.stage==='production'?'#fffbeb':'#eff6ff')+'">'+( stageIcons[p.stage]||'📁')+'</div>';
    h += '<div class="proj-card-body">';
    h += '<div class="proj-card-name">'+esc(coupleName(p.bride,p.groom))+'</div>';
    h += '<div class="proj-card-sub">';
    h += stageBadgeHtml(p.stage);
    if(p.refcode) h += '<span class="badge badge-gray">'+esc(p.refcode)+'</span>';
    if(p.city) h += '<span>📍'+esc(p.city)+'</span>';
    if(d) h += '<span>📅'+fmtDate(d)+(dDays!==null?' ('+urgencyBadgeHtml(dDays)+'  ':' ')+'</span>';
    if(pkg) h += '<span>'+esc(pkg.length>25?pkg.slice(0,25)+'…':pkg)+'</span>';
    h += '</div></div>';
    h += '<div class="proj-card-fin">';
    if(bal > 0){
      h += '<div class="proj-card-bal due">'+fmt(bal)+'</div><div class="text-muted">Balance</div>';
    } else {
      h += '<div class="proj-card-bal paid">'+fmt(paid)+'</div><div class="text-muted">Paid ✓</div>';
    }
    if(net) h += '<div class="text-muted">of '+fmt(net)+'</div>';
    h += '</div>';
    h += '</div>';
  });

  return h;
}

// ── PAGE: COLLECTIONS ─────────────────────────────────────
function renderCollections(){
  var urgentItems = getUrgentItems();
  var overdue = urgentItems.filter(function(x){ return x.urgency==='overdue'; });
  var today = urgentItems.filter(function(x){ return x.urgency==='today'; });
  var soon = urgentItems.filter(function(x){ return x.urgency==='soon'; });
  var upcoming = urgentItems.filter(function(x){ return x.urgency==='upcoming'; });

  var list = Object.values(projects).filter(function(p){ return p.stage!=='complete'&&p.stage!=='lost'; });
  var totalRec = list.reduce(function(a,p){ return a+Math.max(0,balDue(p)); },0);
  var thisMonth = new Date().toISOString().substring(0,7);
  var monthPaid = Object.values(projects).reduce(function(a,p){
    return a + (p.payLedger||[]).filter(function(e){ return (e.date||'').startsWith(thisMonth); }).reduce(function(b,e){ return b+(parseInt(e.amount)||0); },0);
  },0);

  var h = '';
  // Summary strip
  h += '<div class="grid-4" style="margin-bottom:20px">';
  h += '<div class="stat-tile accent-red"><div class="stat-label">🚨 Overdue</div><div class="stat-value">'+overdue.length+'</div><div class="stat-sub">Requires immediate action</div></div>';
  h += '<div class="stat-tile accent-amber"><div class="stat-label">⏳ Due Today / This Week</div><div class="stat-value">'+(today.length+soon.length)+'</div><div class="stat-sub">Act before they become overdue</div></div>';
  h += '<div class="stat-tile accent-blue"><div class="stat-label">📅 Upcoming (30 days)</div><div class="stat-value">'+upcoming.length+'</div><div class="stat-sub">Plan your collection follow-ups</div></div>';
  h += '<div class="stat-tile accent-green"><div class="stat-label">This Month Collected</div><div class="stat-value">'+fmt(monthPaid)+'</div><div class="stat-sub">Total active receivables: '+fmt(totalRec)+'</div></div>';
  h += '</div>';

  function section(title, items, emptyMsg){
    if(items.length===0) return '<div class="card" style="margin-bottom:16px"><div class="card-title">'+title+'</div><div class="text-muted" style="padding:8px 0">'+emptyMsg+'</div></div>';
    var s = '<div class="card" style="margin-bottom:16px"><div class="card-title">'+title+'</div>';
    items.forEach(function(item){ s += renderCollectionRow(item); });
    return s + '</div>';
  }

  h += section('🚨 Overdue Payments', overdue, '✅ No overdue payments — great!');
  h += section('🟠 Due Today', today, 'No payments due today.');
  h += section('🟡 Due This Week (1–7 days)', soon, 'No payments due this week.');
  h += section('📅 Upcoming (Next 30 days)', upcoming, 'No upcoming payments in the next 30 days.');

  return h;
}

function renderCollectionRow(item){
  var p = item.p, s = item.stage;
  var ucClass = {overdue:'urgency-overdue',today:'urgency-today',soon:'urgency-soon',upcoming:'urgency-upcoming'}[item.urgency]||'urgency-upcoming';
  var phone = p.phone||'';
  var waMsg = encodeURIComponent('Dear '+coupleName(p.bride,p.groom)+',\n\nGreetings from KB Studio Productions! 🌹\n\nYour payment of ₹'+s.shortfall.toLocaleString('en-IN')+' for *'+s.label+'* was due on '+fmtDate(item.due)+'.\n\nKindly arrange the payment at your earliest.\n\nThank you,\nTeam KB Studio Productions');
  var waUrl = phone ? 'https://wa.me/91'+phone.replace(/[^0-9]/g,'')+  '?text='+waMsg : '';

  var h = '<div class="urgency-card '+ucClass+'" style="cursor:default">';
  h += '<div class="uc-icon">'+(item.urgency==='overdue'?'🔴':item.urgency==='today'?'🟠':'🟡')+'</div>';
  h += '<div class="uc-body">';
  h += '<div class="uc-name" style="cursor:pointer" onclick="openProject(\''+p.id+'\',\'pt-payments\')">'+esc(coupleName(p.bride,p.groom))+'</div>';
  h += '<div class="uc-detail">'+esc(s.label)+' · Due: <strong>'+fmtDate(item.due)+'</strong>'+(p.city?' · '+esc(p.city):'')+'</div>';

  h += '<button class="btn btn-sm btn-primary" onclick="openProject(\''+p.id+'\',\'pt-payments\')">Ledger</button>';
  if(waUrl) h += '<a href="'+waUrl+'" target="_blank" class="btn btn-sm btn-whatsapp">💬 WhatsApp</a>';
  h += '<button class="btn btn-sm btn-green" onclick="openRecordPayment(\''+p.id+'\',\''+esc(s.key)+'\',\''+esc(s.label)+'\','+s.shortfall+')">✅ Record Cash</button>';
  h += '</div></div>';
  h += '<div style="text-align:right;flex-shrink:0"><div class="fw-800" style="font-size:18px;'+(item.urgency==='overdue'?'color:#dc2626':'color:#d97706')+'">'+fmt(s.shortfall)+'</div>';
  h += '<div class="text-muted">'+urgencyBadgeHtml(item.days)+'</div></div>';

// ── PAGE: CALENDAR ────────────────────────────────────────
function renderCalendar(){
  var list = Object.values(projects).filter(function(p){ return p.stage!=='lost'; });
  var shoots = [];
  list.forEach(function(p){
    if(p.date) shoots.push({ date:p.date, p:p, type:'Main Event' });
    (p.eventDays||[]).forEach(function(ed){
      if(ed&&ed.date&&ed.date!==p.date) shoots.push({ date:ed.date, p:p, type:ed.type||ed.label||'Shoot' });
    });
  });
  shoots.sort(function(a,b){ return a.date.localeCompare(b.date); });

  var today = new Date().toISOString().slice(0,10);
  var upcomingShoots = shoots.filter(function(s){ return s.date >= today; });
  var pastShoots = shoots.filter(function(s){ return s.date < today; });

  var h = '<div class="card"><div class="card-title">📅 Upcoming Shoots</div>';
  if(upcomingShoots.length===0){
    h += '<div class="empty-state" style="padding:24px"><span class="empty-state-icon">📅</span><div class="empty-state-title">No upcoming shoots</div></div>';
  } else {
    h += '<table class="tbl"><thead><tr><th>Date</th><th>Days</th><th>Couple</th><th>Occasion</th><th>City</th><th>Stage</th><th>Balance</th></tr></thead><tbody>';
    upcomingShoots.forEach(function(sh){
      var days = daysUntil(sh.date);
      var p = sh.p;
      var bal = balDue(p);
      h += '<tr onclick="openProject(\''+p.id+'\',\'pt-overview\')" style="cursor:pointer">';
      h += '<td><strong>'+fmtDate(sh.date)+'</strong></td>';
      h += '<td>'+urgencyBadgeHtml(days)+'</td>';
      h += '<td><strong>'+esc(coupleName(p.bride,p.groom))+'</strong><br><span class="text-muted">'+esc(p.refcode||'')+'</span></td>';
      h += '<td><span class="badge badge-purple">'+esc(sh.type)+'</span></td>';
      h += '<td>'+esc(p.city||p.venue||'—')+'</td>';
      h += '<td>'+stageBadgeHtml(p.stage)+'</td>';
      h += '<td class="fw-800 '+(bal>0?'text-red':'text-green')+'">'+fmt(bal>0?bal:0)+(bal<=0?' <span class="badge badge-green">Paid</span>':'')+'</td>';
      h += '</tr>';
    });
    h += '</tbody></table>';
  }
  h += '</div>';

  // Check double-bookings
  var dateMap = {};
  upcomingShoots.forEach(function(sh){
    if(!dateMap[sh.date]) dateMap[sh.date]=[];
    dateMap[sh.date].push(sh);
  });
  var doubleDates = Object.keys(dateMap).filter(function(d){ return dateMap[d].length > 1; });
  if(doubleDates.length > 0){
    h += '<div class="card" style="margin-top:16px;border-color:#fca5a5"><div class="card-title">⚠️ Double-Booked Dates</div>';
    doubleDates.forEach(function(d){
      h += '<div style="background:#fef2f2;border-radius:8px;padding:10px 12px;margin-bottom:8px">';
      h += '<strong>'+fmtDate(d)+'</strong> — '+dateMap[d].length+' shoots: ';
      h += dateMap[d].map(function(sh){ return esc(coupleName(sh.p.bride,sh.p.groom))+' ('+esc(sh.type)+')'; }).join(' &amp; ');
      h += '</div>';
    });
    h += '</div>';
  }

  return h;
}

// ── PROJECT MODAL ─────────────────────────────────────────
function openProject(projId, tabId){
  var p = projects[projId];
  if(!p) return;
  _openProjId = projId;
  $('proj-modal-title').textContent = coupleName(p.bride, p.groom);
  $('proj-modal-sub').textContent = (p.refcode||'') + (p.city?' · '+p.city:'') + (p.date?' · '+fmtDate(p.date):'');
  renderProjOverview();
  renderProjPayments();
  renderProjProduction();
  renderProjDocuments();
  // Switch to requested tab
  var firstBtn = document.querySelector('#proj-tabs .tab-btn');
  if(tabId){
    document.querySelectorAll('#proj-tabs .tab-btn').forEach(function(btn){
      var active = btn.getAttribute('data-pane') === tabId;
      btn.classList.toggle('active', active);
    });
    document.querySelectorAll('#pt-overview,#pt-payments,#pt-production,#pt-documents').forEach(function(pane){
      pane.classList.toggle('active', pane.id === tabId);
    });
  }
  openModal('proj-modal');
}

function switchProjTab(btn){
  document.querySelectorAll('#proj-tabs .tab-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  var paneId = btn.getAttribute('data-pane');
  document.querySelectorAll('#pt-overview,#pt-payments,#pt-production,#pt-documents').forEach(function(p){ p.classList.remove('active'); });
  $(paneId).classList.add('active');
}

function saveDueDate(projId, stageKey, dateVal){
  var upd = {};
  upd['pay_'+stageKey+'_due'] = dateVal;
  // Also update kbSchedule if present
  var p = projects[projId];
  if(p && p.kbSchedule && p.kbSchedule.stages){
    var stages = p.kbSchedule.stages.map(function(s){
      return s.key===stageKey ? Object.assign({},s,{dueDate:dateVal}) : s;
    });
    upd['kbSchedule/stages'] = stages;
  }
  db.ref('crm_projects/'+projId).update(upd, function(err){
    if(err) showToast('Error: '+err.message,'error');
    else {
      if(projects[projId]) projects[projId]['pay_'+stageKey+'_due'] = dateVal;
      showToast('📅 Due date saved.','success');
      renderProjPayments();
      updateUrgencyBadge();
    }
  });
}

function deleteLedgerEntry(projId, idx){
  if(!confirm('Delete this payment entry? This cannot be undone.')) return;
  var p = projects[projId];
  if(!p) return;
  var ledger = (p.payLedger||[]).slice();
  ledger.splice(idx,1);
  db.ref('crm_projects/'+projId+'/payLedger').set(ledger, function(err){
    if(err) showToast('Error: '+err.message,'error');
    else {
      projects[projId].payLedger = ledger;
      showToast('Entry deleted.','success');
      renderProjPayments();
      updateUrgencyBadge();
    }
  });
}

async function scanNAS(projId){
  if(!('showDirectoryPicker' in window)){ alert('Use Chrome, Edge or Safari on Mac/PC to scan drives.'); return; }
  try {
    var dirHandle = await window.showDirectoryPicker({ id:'kbstudio_nas' });
    var total=0, raw=0, vid=0, aud=0, subs=[];
    showToast('⏳ Scanning '+dirHandle.name+'…');
    for await(var entry of dirHandle.values()){
      if(entry.kind==='file'){
        try{ var f=await entry.getFile(); total+=f.size; var fn=f.name.toLowerCase();
        if(/\.(cr2|cr3|arw|nef|raf|dng|rw2)$/.test(fn)) raw++;
        else if(/\.(mp4|mov|mxf|braw|avi|mts)$/.test(fn)) vid++;
        else if(/\.(wav|mp3|aac)$/.test(fn)) aud++;
        } catch(e){}
      } else if(entry.kind==='directory'){
        subs.push(entry.name);
        try{ for await(var se of entry.values()){
          if(se.kind==='file'){ var sf=await se.getFile(); total+=sf.size; var sfn=sf.name.toLowerCase();
          if(/\.(cr2|cr3|arw|nef|raf|dng|rw2)$/.test(sfn)) raw++;
          else if(/\.(mp4|mov|mxf|braw|avi|mts)$/.test(sfn)) vid++;
          else if(/\.(wav|mp3|aac)$/.test(sfn)) aud++;
          }
        }} catch(e){}
      }
    }
    var gb = (total/(1024*1024*1024)).toFixed(1);
    var summary = gb+' GB · '+raw+' RAW · '+vid+' video clips · '+aud+' audio files';
    var p = projects[projId]; if(!p) return;
    var entries = (p.dataEntries||[]).slice();
    entries.push({ size:gb, unit:'GB', location:'NAS / '+dirHandle.name, backup:'nas', status:'dumped',
      photographer: subs.length ? 'Subfolders: '+subs.slice(0,3).join(', ') : 'Main Card',
      date: now(), notes: summary });
    db.ref('crm_projects/'+projId).update({
      dataEntries: entries,
      d_raw_qty: gb,
      d_raw_unit: 'GB',
      d_raw_status: 'dumped'
    }, function(err){
      if(!err){ projects[projId].dataEntries=entries; showToast('✅ Scanned: '+summary,'success'); renderProjProduction(); }
    });
  } catch(err){ if(err.name!=='AbortError') alert('Scan error: '+err.message); }
}

function openRecordPayment(projId, stageKey, stageLabel, suggestedAmount){
  _payModalProjId = projId;

  if(!p) return;
  var sch = reconcilePayments(p);
  $('pay-modal-for').textContent = coupleName(p.bride,p.groom);

  $('rec-date').value = now();
  $('rec-notes').value = '';
  $('rec-ref').value = '';
  $('rec-account').value = '';

  // Populate stage dropdown
  var sel = $('rec-stage');
  sel.innerHTML = '';
  var genOpt = document.createElement('option');
  genOpt.value = 'general'; genOpt.textContent = 'General (Unallocated)';
  sel.appendChild(genOpt);
  sch.forEach(function(s){
    var opt = document.createElement('option');
    opt.value = s.key;
    opt.textContent = s.label + (s.isSettled?' (Paid ✓)':' — '+fmt(s.shortfall)+' remaining');
    if(stageKey && s.key === stageKey) opt.selected = true;
    sel.appendChild(opt);

  if(!stageKey && sch.length > 0){
    var firstPending = sch.find(function(s){ return !s.isSettled; });
    if(firstPending) sel.value = firstPending.key;
  }

  openModal('pay-modal');
}

function savePaymentRecord(){
  var projId = _payModalProjId;
  var p = projects[projId];
  if(!p) return;
  var amt = parseInt($('rec-amount').value)||0;
  if(amt <= 0){ showToast('Enter a valid amount.','error'); return; }
  var entry = {
    amount: amt,
    date: $('rec-date').value || now(),
    stage: $('rec-stage').value || 'general',
    mode: $('rec-mode').value || 'Cash',
    account: ($('rec-account').value||'').trim(),
    ref: ($('rec-ref').value||'').trim(),
    notes: ($('rec-notes').value||'').trim(),
    ts: Date.now(),
    recordedBy: CU.name||CU.username||'Admin'
  };
  var ledger = (p.payLedger||[]).slice();
  ledger.push(entry);
  db.ref('crm_projects/'+projId+'/payLedger').set(ledger, function(err){
    if(err){ showToast('Error: '+err.message,'error'); return; }
    projects[projId].payLedger = ledger;
    showToast('✅ Payment of '+fmt(amt)+' recorded!','success');
    closeModal('pay-modal');
    updateUrgencyBadge();
    if(_openProjId === projId) renderProjPayments();
    if(currentPage==='collections'||currentPage==='dashboard') renderPage(currentPage);
  });
}

// ── NEW PROJECT ───────────────────────────────────────────
function openNewProject(){
  var id = 'proj_'+Date.now();
  var p = {
    id: id,
    stage: 'lead',
    bride: '',
    groom: '',
    createdAt: Date.now(),
    paymentPreset: '50-50',
    value: '0',
    discount: '0'
  };
  projects[id] = p;
  _openProjId = id;
  $('proj-modal-title').textContent = 'New Project';
  $('proj-modal-sub').textContent = 'Fill in the details and click Save';
  renderNewProjectForm();
  document.querySelectorAll('#proj-tabs .tab-btn').forEach(function(b){ b.classList.remove('active'); });
  document.querySelector('#proj-tabs .tab-btn').classList.add('active');
  document.querySelectorAll('#pt-overview,#pt-payments,#pt-production,#pt-documents').forEach(function(p){ p.classList.remove('active'); });
  $('pt-overview').classList.add('active');
  openModal('proj-modal');
}

function saveCurrentProject(){
  var projId = _openProjId;
  if(!projId) return;
  var p = projects[projId]||{};

  // Check if new project form is visible
  var brideEl = $('np-bride');
  if(brideEl){
    var data = {
      id: projId,
      bride: (brideEl.value||'').trim(),
      groom: ($('np-groom').value||'').trim(),
      phone: ($('np-phone').value||'').trim(),
      email: ($('np-email').value||'').trim(),
      city: ($('np-city').value||'').trim(),
      venue: ($('np-venue').value||'').trim(),
      stage: $('np-stage').value||'lead',
      date: $('np-date').value||'',
      package: ($('np-package').value||'').trim(),
      refcode: ($('np-refcode').value||'').trim(),
      value: $('np-value').value||'0',
      discount: $('np-discount').value||'0',
      paymentPreset: $('np-preset').value||'50-50',
      notes: ($('np-notes').value||'').trim(),
      createdAt: p.createdAt||Date.now()
    };
    // Merge with existing project data
    data = Object.assign({}, p, data);
    db.ref('crm_projects/'+projId).set(data, function(err){
      if(err){ showToast('Error: '+err.message,'error'); return; }
      projects[projId] = data;
      showToast('✅ Project saved!','success');
      closeModal('proj-modal');
      updateUrgencyBadge();
      if(currentPage==='projects'||currentPage==='dashboard') renderPage(currentPage);
    });
    return;
  }

  // Otherwise just update what's changed
  showToast('Changes saved automatically via real-time listener.','success');
}
